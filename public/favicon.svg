<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="80%" r="80%">
      <stop offset="0%" stop-color="#0a2118"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="22" fill="url(#bg)"/>
  <!-- Subtle green glow -->
  <ellipse cx="64" cy="90" rx="50" ry="30" fill="#34d399" opacity="0.08"/>
  <!-- "R" in white -->
  <text x="14" y="92" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-weight="300" font-size="72" fill="#ffffff" letter-spacing="-2">R</text>
  <!-- "OS" in emerald green -->
  <text x="52" y="92" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="72" fill="#34d399" letter-spacing="-2">OS</text>
</svg>